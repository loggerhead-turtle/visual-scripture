# Served by nginxinc/nginx-unprivileged (see Dockerfile): non-root, port 8080.
# This file is included inside nginx's http{} block, so `map` is allowed here.

# Cache-Control by path. Code has no hashed filenames, so it is always
# revalidated (ETag/304); data changes rarely and may be kept for a few hours.
# Done with a map + one add_header so every location inherits the same set of
# headers — an add_header inside a location would silently drop all the
# server-level ones (nginx add_header does not merge across levels).
map $uri $vs_cache_control {
    default   "public, max-age=0, must-revalidate";
    ~^/data/  "public, max-age=21600, stale-while-revalidate=86400";
}

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    # ---- security headers: `always` so error pages carry them too ----
    # Mirror of the <meta http-equiv> policy in index.html, plus frame-ancestors.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control $vs_cache_control always;

    # nothing hidden is ever served (.git, .dockerignore, editor files)
    location ~ /\. { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
